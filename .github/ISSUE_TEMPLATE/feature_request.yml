name: 💡 Feature request
description: Suggest an idea, a new controller, or an improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks — ideas from real setups are what shape this project.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution yet.
      placeholder: |
        I use two X1 units and the HUD card only ever shows one deck label, so
        during a set I can't tell which unit a knob belongs to.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Controller / device support
        - Overlay visuals
        - Editor / placement
        - Mapping / wizard
        - Desktop app
        - Docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to help test this.
          required: false
        - label: I'm willing to help implement this.
          required: false
